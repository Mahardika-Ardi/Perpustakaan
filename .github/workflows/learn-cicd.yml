name: 'Latihan CI CD'

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Tahap 1 - Simulasi Testing
        run: echo "Mengecek struktur kode... Tidak ada error!"

      - name: Tahap 2 - Simulasi Build
        run: |
          echo "Memulai proses build..."
          ls -la
          echo "Build selesai dan aplikasi siap tayang!"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulasi Build Proyek
        run: |
          echo "Mengompilasi file aplikasi..."
          sleep 5
          echo "Build selesai!"

  deploy-ke-server:
    needs: [test-and-build, build]
    runs-on: ubuntu-latest
    steps:
      - name: Simulasi Deploy
        run: echo "Tes dan build sukses! Mengunggah aplikasi ke server..."
