name: 'Latihan CI CD'

on:
  push:
    branches: [main]

jobs:
  # JOB 1: Semua proses yang memakai folder & node_modules yang sama wajib di 1 job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'

      - name: Install Dependency
        run: npm install

      - name: Generate prisma
        run: npx prisma generate

      - name: Application build
        run: npm run build

      - name: Upload dist to artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: dist/
          retention-days: 1

  # JOB 2: Berjalan paralel dengan Job 1 (karena tidak memakai 'needs')
  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'

      - name: Install Dependency
        run: npm install

      - name: Generate prisma
        run: npx prisma generate

      - name: Jalankan Unit Test
        run: npm test

  # JOB 3: Menunggu 'build' dan 'test' sukses, lalu mengambil hasil artifact
  deploy-to-server:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      # 1. Wajib ada agar package.json tersedia untuk npm start
      - name: Clone github repository
        uses: actions/checkout@v4

      # 2. Siapkan Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'

      # 3. Instal dependensi yang dibutuhkan untuk menjalankan server
      - name: Install Dependency
        run: npm install

      # 4. Generate Prisma (hapus langkah ini jika server tidak memakai Prisma saat startup)
      - name: Generate prisma
        run: npx prisma generate

      # 5. Ambil folder dist/ hasil build dari job sebelumnya
      - name: Download hasil build dari artifact
        uses: actions/download-artifact@v4
        with:
          name: build-result
          path: dist/

      # 6. Jalankan npm start selama 5 detik, lalu hentikan otomatis
      - name: Simulasi Deploy (Jalankan & Hentikan Server)
        run: |
          EXIT_CODE=0
          timeout 5s npm start || EXIT_CODE=$?
          if [ $EXIT_CODE -eq 124 ]; then
            echo "Server berhasil menyala selama 5 detik dan dihentikan dengan aman!"
          else
            echo "Server gagal menyala atau langsung crash (Exit code: $EXIT_CODE)"
            exit 1
          fi
