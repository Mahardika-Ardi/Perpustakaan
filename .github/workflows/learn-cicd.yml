name: 'Latihan CI CD'

on:
  push:
    branches: [main]

jobs:
  # JOB 1: Tarik pembaruan kode, install package, dan build langsung di folder VM
  build:
    runs-on: self-hosted
    steps:
      - name: Update kode & build aplikasi
        run: |
          cd ~/perpustakaan
          git pull origin main
          npm install
          npx prisma generate
          npm run build

  # JOB 2: Langsung jalankan unit test di folder yang sama (tanpa clone & install ulang)
  unit-test:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Jalankan unit test
        run: |
          cd ~/perpustakaan
          npm test

  # JOB 3: Langsung restart PM2 karena kode dan hasil build sudah siap di folder tersebut
  deploy-to-server:
    needs: unit-test
    runs-on: self-hosted
    steps:
      - name: Restart aplikasi dengan PM2
        run: |
          cd ~/perpustakaan
          pm2 restart perpustakaan
