name: 'Latihan CI CD'

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone github repository
        uses: actions/checkout@v4

      - name: Github build simulation
        run: npm run build
      - name: Upload dist to artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulasi Build Proyek
        run: |
          echo "Mengompilasi file aplikasi..."
          sleep 5
          echo "Build selesai!"

  deploy-ke-server:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Simulasi Deploy
        run: echo "Tes dan build sukses! Mengunggah aplikasi ke server..."
