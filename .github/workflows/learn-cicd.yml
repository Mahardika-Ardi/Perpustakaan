name: 'Latihan CI CD'

on:
  push:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'v26.8.1'
      - name: Clone github repository
        uses: actions/checkout@v4

  install-dependencies:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Install Depedency
        run: npm ci

  pre-build:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Generate prisma
        run: npx prisma generate
  build:
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      - name: Application build simulation
        run: npm run build
      - name: Upload dist to artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: dist/
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulasi Build Proyek
        run: |
          echo "Mengompilasi file aplikasi..."
          sleep 5
          echo "Build selesai!"

  deploy-ke-server:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulasi Deploy
        run: echo "Tes dan build sukses! Mengunggah aplikasi ke server..."
